<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenVibe.Community — Coming Soon</title>
<meta name="description" content="The community hub of the OpenVibe network. Coming soon.">
<meta property="og:title" content="OpenVibe.Community">
<meta property="og:description" content="The community hub of the OpenVibe network. Coming soon.">
<meta property="og:url" content="https://openvibe.community/">
<style>
  :root { --accent:#8b5cf6; --accent-light:#a78bfa; --bg:#131318; --bg2:#1a1a22; --text:#e8e6e3; --muted:#9a9a9a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .glyph { width:72px; height:72px; border-radius:20px; background:linear-gradient(135deg,var(--accent),#22d3ee);
           display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem; font-size:2rem; }
  h1 { font-size:clamp(1.8rem,5vw,3rem); letter-spacing:-0.02em; }
  h1 span { color:var(--accent-light); }
  p.tag { color:var(--muted); margin:1rem 0 2.5rem; font-size:1.1rem; max-width:34rem; }
  .links { display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center; }
  .links a { color:var(--text); text-decoration:none; background:var(--bg2); border:1px solid #2a2a32;
             padding:0.6rem 1.1rem; border-radius:10px; transition:border-color .15s, transform .15s; }
  .links a:hover { border-color:var(--accent); transform:translateY(-1px); }
  footer { position:fixed; bottom:1.2rem; color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
  <div class="glyph">✦</div>
  <h1>OpenVibe<span>.Community</span></h1>
  <p class="tag">A home for the people of the OpenVibe network. We're still building this one — check back soon.</p>
  <div class="links">
    <a href="https://openvibe.live">OpenVibe.Live</a>
    <a href="https://openvibe.tools">OpenVibe.Tools</a>
    <a href="https://openvibe.games">OpenVibe.Games</a>
    <a href="https://openvibe.network">Your Account</a>
  </div>
  <footer>© 2026 OpenVibe — Community Project</footer>
</body>
</html>
