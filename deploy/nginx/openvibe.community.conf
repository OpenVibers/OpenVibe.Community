## ═══════════════════════════════════════════════════════════════
## openvibe.community — Nginx Configuration (REFERENCE)
##
## This file is what is deployed to /etc/nginx/sites-available/openvibe.community.conf
## — keep them in sync, and reload nginx after changing it.
##
## The Node app (port 4200, systemd unit openvibe-community) renders every page and proxies
## /api/pastes/* to OpenVibe.Live. nginx terminates TLS, redirects www → apex, rate-limits
## the auth and API paths, and compresses text.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovcommunity_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovcommunity_auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.community www.openvibe.community;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.community$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.community;

    ssl_certificate     /etc/letsencrypt/live/openvibe.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.community/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.community$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.community;

    ssl_certificate     /etc/letsencrypt/live/openvibe.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.community/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.community.access.log;
    error_log  /var/log/nginx/openvibe.community.error.log;

    # Text pastes are capped by Media (512 KB by default); screenshots go up to 16 MB there.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress text for the hop to Cloudflare as well (the global config only compresses
    # text/html and never proxied responses).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml application/rss+xml;

    # ── OAuth session endpoints (strict rate limit) ─────────
    location /auth/ {
        limit_req zone=ovcommunity_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Screenshot uploads (multipart, streamed through to Live → Media) ──
    location = /api/pastes/screenshot {
        limit_req zone=ovcommunity_api burst=5 nodelay;
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API (moderate rate limit) ───────────────────────────
    location /api/ {
        limit_req zone=ovcommunity_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets: Node marks hashed ?v= URLs immutable; let browsers keep them ──
    location ~ ^/(?!api/|auth/).*\.(?:css|js|svg|png|ico|webmanifest|woff2?)$ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4200/metrics). Node also
    #    refuses any request carrying X-Forwarded-For, which every location above sets. ──
    location = /metrics { return 404; }

    # ── Everything else (server-rendered pages) ─────────────
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
